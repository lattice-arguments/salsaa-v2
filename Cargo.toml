[package]
name = "salsaa"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
rokoko = { git = "https://github.com/lattice-arguments/rokoko.git", rev = "8f971175214a00fa354e0c08f8bdb6e15060e9d1" }

[features]
default = ["rokoko/p-28"]

incomplete-rexl = ["rokoko/incomplete-rexl"]
unsafe-sumcheck = ["rokoko/unsafe-sumcheck"]
debug-hardness = ["rokoko/debug-hardness"]
debug-decomp = ["rokoko/debug-decomp"]

p-30 = ["rokoko/p-30"]
p-26 = ["rokoko/p-26"]
p-28 = ["rokoko/p-28"]
